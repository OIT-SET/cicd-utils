name: Publish Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish'
        required: true

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=${{ github.event.inputs.version }}
          echo "Creating release for version $VERSION"
          gh release create "v$VERSION" --title "v$VERSION" --generate-notes --notes "Release notes for version $VERSION:"
      - name: Upload Release Assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=${{ github.event.inputs.version }}
          echo "Uploading assets for version $VERSION"
          gh release upload "v$VERSION" ./scripts/builder --clobber
          gh release upload "v$VERSION" ./scripts/install-dependencies --clobber
          gh release upload "v$VERSION" ./scripts/oracle-setup --clobber
